<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1864ab;}
    .sub{font-size:12px;fill:#495057;}
    .name{font-size:13px;font-weight:600;fill:#37474f;}
    .pct{font-size:11px;fill:#fff;font-weight:600;}
    .leg{font-size:12px;fill:#495057;}
    .axis{font-size:10px;fill:#868e96;}
  </style>

  <text x="20" y="30" class="ttl">Method coverage — where every read landed</text>
  <text x="20" y="50" class="sub">EBV-only reference test: almost nothing aligns to the reference, so MMseqs rescue and dark matter dominate. The rescue bucket is what the candidate table lists.</text>

  <!-- bar geometry: x start 150, width 700 = 100% -->
  <!-- Miseq_Run_A -->
  <text x="20" y="112" class="name">Miseq_Run_A</text>
  <text x="20" y="128" class="axis">117,322 reads</text>
  <!-- align 0.01% (sliver), k2only 0, species 14.7%, highrank 5.0%, dark 80.3% -->
  <rect x="150" y="95" width="2"  height="34" fill="#1c7ed6"/>
  <rect x="152" y="95" width="103" height="34" fill="#2f9e44"/>
  <rect x="255" y="95" width="35"  height="34" fill="#f59f00"/>
  <rect x="290" y="95" width="560" height="34" fill="#343a40"/>
  <text x="203" y="116" text-anchor="middle" class="pct">14.7%</text>
  <text x="272" y="116" text-anchor="middle" class="pct">5%</text>
  <text x="570" y="116" text-anchor="middle" class="pct">dark 80.3%</text>

  <!-- Nanopore_Run_A -->
  <text x="20" y="184" class="name">Nanopore_Run_A</text>
  <text x="20" y="200" class="axis">3,000 reads</text>
  <!-- align 0.07%, species ~3.9%, highrank 1.4%, dark 94.6% -->
  <rect x="150" y="167" width="2"  height="34" fill="#1c7ed6"/>
  <rect x="152" y="167" width="27" height="34" fill="#2f9e44"/>
  <rect x="179" y="167" width="10" height="34" fill="#f59f00"/>
  <rect x="189" y="167" width="661" height="34" fill="#343a40"/>
  <text x="165" y="188" text-anchor="middle" class="pct" fill="#1b5e20">3.9%</text>
  <text x="520" y="188" text-anchor="middle" class="pct">dark 94.6%</text>

  <line x1="150" y1="218" x2="850" y2="218" stroke="#dee2e6"/>
  <text x="150" y="232" class="axis">0%</text>
  <text x="500" y="232" text-anchor="middle" class="axis">50%</text>
  <text x="850" y="232" text-anchor="end" class="axis">100%</text>

  <!-- legend -->
  <g transform="translate(150,262)">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="#1c7ed6"/><text x="20" y="11" class="leg">Aligned to reference (TASS)</text>
    <rect x="220" y="0" width="13" height="13" rx="2" fill="#adb5bd"/><text x="240" y="11" class="leg">Kraken2-classified only</text>
    <rect x="430" y="0" width="13" height="13" rx="2" fill="#2f9e44"/><text x="450" y="11" class="leg">mmseqs → species</text>
    <rect x="0" y="26" width="13" height="13" rx="2" fill="#f59f00"/><text x="20" y="37" class="leg">mmseqs → genus+ (rescued)</text>
    <rect x="220" y="26" width="13" height="13" rx="2" fill="#343a40"/><text x="240" y="37" class="leg">Dark matter (nothing placed it)</text>
  </g>

  <text x="20" y="345" class="sub">The five buckets are disjoint and sum to 100%. Hovering any segment in the report shows its exact percentage and read count.</text>
</svg>
