<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TaxTriage">
  <!-- Header mark. Drawn in white so it reads on the coloured header
       bar in both colour schemes. Deliberately simple: it is rendered at ~24px.
       Motif: ranked detections, with the top hit flagged. -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="10" y1="18" x2="40" y2="18" />
    <line x1="10" y1="32" x2="32" y2="32" />
    <line x1="10" y1="46" x2="24" y2="46" />
  </g>
  <circle cx="52" cy="18" r="7" fill="#ffffff" />
</svg>
