  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="14" y1="21" x2="38" y2="21" />
    <line x1="14" y1="32" x2="32" y2="32" />
    <line x1="14" y1="43" x2="26" y2="43" />
  </g>
  <circle cx="48" cy="21" r="5.5" fill="#ffffff" />
</svg>
