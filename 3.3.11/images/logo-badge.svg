<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TaxTriage logo">
  <!-- README/badge variant of docs/images/logo.svg: same header mark, with the
       navy header-bar colour (#1F4E79, matching the ODR PDF header and the
       interactive report banner) baked in as a background so it reads on
       GitHub's white page background. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1F4E79" />
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <line x1="10" y1="18" x2="40" y2="18" />
    <line x1="10" y1="32" x2="32" y2="32" />
    <line x1="10" y1="46" x2="24" y2="46" />
  </g>
  <circle cx="52" cy="18" r="7" fill="#ffffff" />
</svg>
