site_name: TaxTriage
site_description: >-
  A flexible, containerized Nextflow pipeline for identifying pathogens in
  complex samples from untargeted DNA or RNA sequencing data.
site_author: JHU/APL Bioinformatics
# Versioned deployments live under /taxtriage/<version>/ (see mike config in
# `extra` below). The root redirects to whichever version is the default.
site_url: https://jhuapl-bio.github.io/taxtriage/

repo_url: https://github.com/jhuapl-bio/taxtriage
repo_name: jhuapl-bio/taxtriage
edit_uri: edit/main/docs/

copyright: Copyright &copy; Johns Hopkins University Applied Physics Laboratory

# docs/ predates the site and also holds design sketches and reference PDFs.
# Keep them in the repo but out of the published site.
exclude_docs: |
  novelty_sketch/
  similarity_metrics_v2.pdf
  images/Cloud_AWS_NFTower_only/
  images/*.pdf
  README-docs.md

theme:
  name: material
  language: en
  logo: images/taxtriage_logo_light.png
  favicon: images/taxtriage_logo_light.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # slugify matches GitHub's heading-anchor algorithm so that anchors carried
  # over from the old wiki (and any external deep links) keep working.
  - toc:
      permalink: true
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # Generated by scripts/write_docs_ref.py before every build. Pins which git
  # ref the pathogen sheet is read from, so versioned docs show the sheet that
  # shipped with that release. Must load before pathogen_table.js.
  - javascripts/docs_ref.js
  - javascripts/pathogen_table.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/pathogen_table.css

extra:
  # Renders the version dropdown in the header. mike writes versions.json to
  # the root of the gh-pages branch; the theme reads it at runtime.
  version:
    provider: mike
    default: latest

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jhuapl-bio/taxtriage
      name: TaxTriage on GitHub
    - icon: fontawesome/brands/slack
      link: https://nfcore.slack.com/channels/taxtriage
      name: nf-core Slack

# Top-level entries render as tabs (navigation.tabs), so "Documentation",
# "Demo Report" and "Pathogen Sheet" are the three tabs across the header.
nav:
  - Documentation:
      - Home: index.md
      - Getting Started:
          - Installation: installation.md
          - Quick Start: quick-start.md
      - Usage:
          - Samplesheet: samplesheet.md
          - Pre-Aligned Input: pre-aligned-input.md
          - Running the Pipeline: running-the-pipeline.md
          - CLI Parameters: cli-parameters.md
      - Pipeline Reference:
          - Pipeline Modules: pipeline-modules.md
          - Output: output.md
          - Interactive Report: interactive-report.md
          - TASS Scoring: tass-scoring.md
          - Microbial Categories: microbial-categories.md
          - Novelty Detection: novelty-detection.md
          - Detection Rescue: detection-rescue.md
          - In-Silico Simulation: in-silico.md
      - Deployment:
          - Cloud & Seqera: cloud-and-seqera.md
          - Geneious Plugin: geneious-plugin.md
      - Community:
          - Troubleshooting: troubleshooting.md
          - Contributing: contributing.md
          - Citations: citations.md
  - Demo Report: demo-report.md
  - Pathogen Sheet: pathogen-sheet.md
