name: Docs check

# Builds and tests the documentation site without deploying it. Runs on pull
# requests into dev and main so doc breakage is caught in review rather than
# after a merge triggers a deploy.
#
# Both shapes are built:
#   latest   the full site, including the real Demo Report tab
#   release  a versioned build, where Demo Report redirects to latest
#
# Building both matters: the release shape is only exercised when a release is
# published, which is exactly when you least want to discover it is broken.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/write_docs_ref.py"
      - "scripts/docs_release_stub.py"
      - "scripts/inline_boot_json.py"
      - "scripts/test_pathogen_table.js"
      - "scripts/test_built_links.py"
      - "assets/heatmap.html"
      - "assets/pages.js"
      - "assets/heatmap_boot.js"
      - "assets/pathogen_sheet.csv"
      - ".github/workflows/docs*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [latest, release]
    name: build (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      # Read data from the PR's own head, so a PR that changes the pathogen
      # sheet is validated against its own version of the file.
      - name: Pin data ref
        run: |
          python scripts/write_docs_ref.py \
            --ref "${{ github.event.pull_request.head.sha || github.sha }}" \
            --version "pr-${{ github.event.pull_request.number || 'manual' }}"

      # Fails loudly if a nav entry or page was renamed such that the release
      # build would silently stop redirecting.
      - name: Verify demo tab is stubbable
        run: python scripts/docs_release_stub.py --check

      - name: Redirect demo tab to latest
        if: matrix.variant == 'release'
        run: python scripts/docs_release_stub.py

      - name: Build interactive report dist
        if: matrix.variant == 'latest'
        run: |
          python scripts/inline_boot_json.py
          test -s _site/index.html
          mkdir -p docs/demo
          cp _site/index.html docs/demo/index.html

      - name: Test pathogen sheet table
        run: |
          npm install --no-fund --no-audit --no-save jsdom
          node scripts/test_pathogen_table.js

      # The Pathogen Sheet renders a "Request an organism" link pointing at an
      # issue form. The link is built in JS, so a renamed template would only
      # surface as a 404 for a user — check the referenced file exists.
      - name: Verify issue template referenced by the site exists
        run: |
          set -euo pipefail
          TMPL="$(sed -nE 's/.*ISSUE_TEMPLATE = "([^"]+)".*/\1/p' docs/javascripts/pathogen_table.js)"
          test -n "$TMPL" || { echo "::error::could not find ISSUE_TEMPLATE in pathogen_table.js"; exit 1; }
          test -f ".github/ISSUE_TEMPLATE/$TMPL" \
            || { echo "::error::.github/ISSUE_TEMPLATE/$TMPL is missing"; exit 1; }
          python -c "import sys,yaml; yaml.safe_load(open('.github/ISSUE_TEMPLATE/$TMPL'))"
          echo "Issue form $TMPL present and valid."

      - name: Build site
        run: mkdocs build --strict

      - name: Check built links
        run: python scripts/test_built_links.py --site site

      - name: Confirm release build shape
        if: matrix.variant == 'release'
        run: |
          set -euo pipefail
          grep -q "url=../../latest/demo-report/" site/demo-report/index.html \
            || { echo "::error::demo-report should redirect to latest"; exit 1; }
          test ! -e site/demo/index.html \
            || { echo "::error::release build should not ship the report dist"; exit 1; }
          # The pathogen sheet is a real page in every version, pinned to its
          # own ref — it must NOT have been turned into a redirect.
          grep -q 'id="pathogen-app"' site/pathogen-sheet/index.html \
            || { echo "::error::pathogen-sheet should be the real table, not a redirect"; exit 1; }
          ! grep -q "http-equiv=\"refresh\"" site/pathogen-sheet/index.html \
            || { echo "::error::pathogen-sheet should not redirect"; exit 1; }
          echo "Demo redirects to latest; pathogen sheet ships version-pinned."
