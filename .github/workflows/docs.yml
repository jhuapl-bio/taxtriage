name: Docs

# Publishes versioned documentation to https://jhuapl-bio.github.io/taxtriage/
#
# Version scheme (managed by `mike`, which commits the *rendered site only* to
# the gh-pages branch — no source ever lands there):
#
#   latest             built from main on every push. This is the default, so
#                      the site root redirects here.
#   3.3.9, 3.3.8, …    one entry per release, cut from the release tag.
#
# Each release also gets a minor alias (v3.3.9 -> version "3.3.9", alias "3.3")
# so /3.3/ is a stable URL that always follows the newest patch in that series.
# Aliases are URLs, not separate dropdown entries, so the selector lists exact
# patch versions only.
#
# NOTE: `latest` is a real version here, not an alias, because it tracks main.
# mike keeps versions and aliases in one namespace, so releases must not also
# claim `latest`.
#
# Branch model: work happens on `dev` via PRs, then `dev` merges into `main`.
# Merging to main refreshes `latest`; publishing a GitHub Release cuts a
# numbered copy.

on:
  release:
    types: [published]
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/write_docs_ref.py"
      - "scripts/inline_boot_json.py"
      - "scripts/test_pathogen_table.js"
      - "scripts/test_built_links.py"
      - "assets/heatmap.html"
      - "assets/pages.js"
      - "assets/heatmap_boot.js"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to deploy (blank = latest)"
        required: false
        default: ""

permissions:
  contents: write # mike pushes the built site to the pages branch

env:
  # Branch mike commits the rendered site to. It is machine-owned: only built
  # HTML/CSS/JS lives there, never source. Must match Settings -> Pages -> Source.
  PAGES_BRANCH: gh-pages

# Serialise deployments: two concurrent mike runs would race on gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # mike needs the gh-pages branch and tag history.
          fetch-depth: 0

      - name: Resolve version and data ref
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            # v3.3.9 -> version 3.3.9, alias 3.3
            VERSION="${TAG#v}"
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::Tag '$TAG' is not vX.Y.Z; refusing to publish docs for it."
              exit 1
            fi
            ALIAS="$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"
            # A prerelease still gets its own entry, but must not take over the
            # stable /3.3/ URL from the released patch.
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              echo "Prerelease: publishing '$VERSION' without moving the '$ALIAS' alias"
              ALIAS=""
            fi
            REF="$TAG"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION:-latest}"
            ALIAS=""
            REF="main"
          fi
          if [ "$VERSION" = "latest" ] && [ "${{ github.event_name }}" = "release" ]; then
            echo "::error::Refusing to publish a release as 'latest'; that name tracks main."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS"     >> "$GITHUB_OUTPUT"
          echo "ref=$REF"         >> "$GITHUB_OUTPUT"
          echo "Deploying docs version '$VERSION' (alias '${ALIAS:-none}') reading data from '$REF'"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # inline_boot_json.py evaluates the report boot JS with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Pin data ref for this version
        run: |
          python scripts/write_docs_ref.py \
            --ref "${{ steps.v.outputs.ref }}" \
            --version "${{ steps.v.outputs.version }}"

      # Same dist the pipeline's own Pages job produced: heatmap.html with its
      # CSS/JS folded inline and the bootstrap data embedded, as one file.
      - name: Build interactive report dist
        run: |
          python scripts/inline_boot_json.py
          test -s _site/index.html
          mkdir -p docs/demo
          cp _site/index.html docs/demo/index.html
          echo "dist size: $(du -h docs/demo/index.html | cut -f1)"

      # Runs the real table widget in jsdom against this ref's actual CSV, so an
      # upstream schema change fails here rather than in the browser.
      - name: Test pathogen sheet table
        run: |
          npm install --no-fund --no-audit --no-save jsdom
          node scripts/test_pathogen_table.js

      - name: Build site
        run: mkdocs build --strict

      # mkdocs --strict only validates Markdown links; this catches raw-HTML
      # src paths, which resolve against the page's directory URL.
      - name: Check built links
        run: python scripts/test_built_links.py --site site

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy version
        run: |
          set -euo pipefail
          ARGS=(--push --branch "$PAGES_BRANCH" --update-aliases "${{ steps.v.outputs.version }}")
          if [ -n "${{ steps.v.outputs.alias }}" ]; then
            ARGS+=("${{ steps.v.outputs.alias }}")
          fi
          mike deploy "${ARGS[@]}"

      # The site root redirects here. Without this the root 404s. Idempotent, so
      # it is safe to reassert on every main push; releases never move it.
      - name: Point default at latest
        if: steps.v.outputs.version == 'latest'
        run: mike set-default --push --branch "$PAGES_BRANCH" latest

      # One-time migration: the retired `bleeding-edge` version predates the
      # switch to `latest`. Safe to delete this step once it has run and the
      # entry is gone from the dropdown.
      - name: Remove retired bleeding-edge version
        run: |
          set -euo pipefail
          if mike list --branch "$PAGES_BRANCH" 2>/dev/null | grep -qx 'bleeding-edge'; then
            echo "Deleting retired 'bleeding-edge' docs version"
            mike delete --push --branch "$PAGES_BRANCH" bleeding-edge
          else
            echo "No 'bleeding-edge' version present; nothing to do"
          fi

      - name: Summary
        run: |
          {
            echo "### Docs deployed"
            echo ""
            echo "- **Version:** \`${{ steps.v.outputs.version }}\`"
            echo "- **Data ref:** \`${{ steps.v.outputs.ref }}\`"
            echo "- **URL:** https://jhuapl-bio.github.io/taxtriage/${{ steps.v.outputs.version }}/"
          } >> "$GITHUB_STEP_SUMMARY"
