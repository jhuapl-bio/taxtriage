name: Docs

# Publishes versioned documentation to https://jhuapl-bio.github.io/taxtriage/
#
# Version scheme (managed by `mike`, which commits the *rendered site only* to
# the gh-pages branch — no source ever lands there):
#
#   stable             the newest RELEASE. Built from that release's tag and
#                      shown in the version dropdown as "stable (X.Y.Z)". This
#                      is the default, so the site root redirects here. `latest`
#                      is kept as an alias of it, so every old /latest/ URL
#                      still resolves. A push to main that touches ONLY
#                      documentation or interactive-report source also refreshes
#                      it from main — such a push cannot make the docs describe
#                      unreleased pipeline behaviour, and waiting for the next
#                      release to publish a typo fix is not worth it. The
#                      Pathogen Sheet stays pinned to the release tag either
#                      way, and the footer records the ref actually built.
#   main               unreleased work merged to main. Shown in the dropdown as
#                      "development"; never the default.
#   3.3.9, 3.3.8, …    one frozen entry per release, cut from the release tag.
#                      Exact patch versions only — no minor-series aliases.
#
# Every build stamps the ref and commit it came from into the page footer, so a
# reader can always tell which revision they are looking at.
#
# Branch model: single-branch. PRs merge into `main`; publishing a GitHub
# Release cuts a frozen numbered copy and moves `latest`/`stable` onto it.

on:
  # `edited` matters as much as `published`: retargeting a release at a newer
  # commit fires `edited`, and the docs for that version must be rebuilt from
  # the tag's new commit. mike overwrites the existing version directory, so
  # re-running simply replaces it.
  release:
    types: [published, edited]
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/write_docs_ref.py"
      - "scripts/docs_release_stub.py"
      - "scripts/inline_boot_json.py"
      - "scripts/test_pathogen_table.js"
      - "scripts/test_built_links.py"
      - "assets/heatmap.html"
      - "assets/pages.js"
      - "assets/heatmap_boot.js"
      - "assets/src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)deploy: 3.3.9, main, or stable. Blank = stable (newest tag)."
        required: false
        default: ""
      ref:
        description: "Git ref to build from. Blank = the ref that version implies."
        required: false
        default: ""

permissions:
  contents: write # mike pushes the built site to the pages branch

env:
  # Branch mike commits the rendered site to. It is machine-owned: only built
  # HTML/CSS/JS lives there, never source. Must match Settings -> Pages -> Source.
  PAGES_BRANCH: gh-pages

# Serialise deployments: two concurrent mike runs would race on gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  # A release publishes two things from one tag: the frozen numbered copy and a
  # refreshed `latest`. Working that out once, here, keeps the deploy job a
  # single code path driven by its matrix.
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan deployments
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          BEFORE: ${{ github.event.before }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          newest_tag() {
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1
          }

          # True when every file in this push is documentation or interactive
          # report source — nothing that changes how the pipeline runs. Those
          # pushes may refresh `latest` immediately instead of waiting for the
          # next release, since they cannot make the published docs describe
          # behaviour the release does not have.
          docs_only() {
            git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1 || return 1
            local files f
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            [ -n "$files" ] || return 1
            while IFS= read -r f; do
              case "$f" in
                docs/*|mkdocs.yml|requirements-docs.txt) ;;
                scripts/write_docs_ref.py|scripts/inline_boot_json.py|scripts/docs_release_stub.py) ;;
                scripts/test_pathogen_table.js|scripts/test_built_links.py) ;;
                assets/heatmap.html|assets/heatmap_boot.js|assets/pages.js|assets/src/*) ;;
                .github/workflows/docs.yml) ;;
                *) echo "not docs-only: $f"; return 1 ;;
              esac
            done <<<"$files"
            return 0
          }

          # One JSON object per deployment:
          #   version  mike version directory
          #   ref      git ref to build the site from
          #   dataref  git ref the Pathogen Sheet CSV is read from at page load
          #   title    dropdown label ("" = mike's default, the version itself)
          #   aliases  extra names pointing at it, space separated
          #   demo     whether to ship the ~4.5 MB Demo Report dist
          TARGETS="[]"
          add() {
            TARGETS="$(jq -c --arg v "$1" --arg r "$2" --arg dr "$3" --arg t "$4" --arg a "$5" --argjson d "$6" \
              '. + [{version:$v, ref:$r, dataref:$dr, title:$t, aliases:$a, demo:$d}]' <<<"$TARGETS")"
          }

          case "$EVENT" in
            release)
              V="${TAG#v}"
              echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' \
                || { echo "::error::'$TAG' is not vX.Y.Z; refusing to publish docs for it."; exit 1; }
              # Frozen copy, then the moving one. Order matters only for reading
              # the log; each deploy is independent.
              add "$V"      "$TAG" "$TAG" ""              ""       false
              add "stable"  "$TAG" "$TAG" "stable ($V)"   "latest" true
              ;;
            push)
              add "main" "main" "main" "development" "" true
              # A docs- or report-only push also refreshes `stable`, so a typo
              # fix or a report tweak is live the same day. The site is built
              # from main, but the Pathogen Sheet stays pinned to the release
              # tag: `stable` still documents the released pipeline, and the
              # footer stamp records that it was built from main.
              if [ "$EVENT" = push ] && docs_only; then
                T="$(newest_tag)"
                if [ -n "$T" ]; then
                  echo "docs/report-only push; refreshing stable from main (data pinned to $T)"
                  add "stable" "main" "$T" "stable (${T#v})" "latest" true
                else
                  echo "no release tag yet; leaving stable alone"
                fi
              fi
              ;;
            *)
              V="${IN_VERSION:-stable}"
              case "$V" in
                stable|latest)
                  REF="${IN_REF:-$(newest_tag)}"
                  test -n "$REF" || { echo "::error::no vX.Y.Z tag exists yet"; exit 1; }
                  add "stable" "$REF" "$REF" "stable (${REF#v})" "latest" true
                  ;;
                main)
                  add "main" "${IN_REF:-main}" "${IN_REF:-main}" "development" "" true
                  ;;
                *)
                  echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' \
                    || { echo "::error::'$V' is not X.Y.Z, 'main' or 'stable'."; exit 1; }
                  add "$V" "${IN_REF:-v$V}" "${IN_REF:-v$V}" "" "" false
                  ;;
              esac
              ;;
          esac

          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          jq . <<<"$TARGETS"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Both entries push to gh-pages; running them together would race.
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    name: deploy (${{ matrix.target.version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the ref itself, so retargeting a release at a newer commit
          # rebuilds from that commit rather than from whatever the event
          # happened to point at. fetch-depth 0 also gives mike the gh-pages
          # branch and full tag history.
          ref: ${{ matrix.target.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # inline_boot_json.py evaluates the report boot JS with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      # Pins the data ref for this version and records the exact revision the
      # footer shows.
      - name: Pin data ref for this version
        run: |
          python scripts/write_docs_ref.py \
            --ref "${{ matrix.target.dataref }}" \
            --version "${{ matrix.target.version }}" \
            --label "${{ matrix.target.title }}" \
            --commit "$(git rev-parse HEAD)"

      # Only the moving builds carry the Demo Report: copying its ~4.5 MB dist
      # into every release would bloat gh-pages. A frozen build replaces it with
      # a redirect, so the tab and the URL keep working.
      #
      # The Pathogen Sheet ships in every version, pinned above to that
      # version's ref, so each release documents the sheet it actually shipped.
      - name: Redirect demo tab to stable
        if: ${{ !matrix.target.demo }}
        run: python scripts/docs_release_stub.py

      # Same dist the pipeline's own Pages job produced: heatmap.html with its
      # CSS/JS folded inline and the bootstrap data embedded, as one file.
      - name: Build interactive report dist
        if: ${{ matrix.target.demo }}
        run: |
          python scripts/inline_boot_json.py
          test -s _site/index.html
          mkdir -p docs/demo
          cp _site/index.html docs/demo/index.html
          echo "dist size: $(du -h docs/demo/index.html | cut -f1)"

      # Runs the real table widget in jsdom against this ref's actual CSV, so a
      # schema change fails here rather than in the browser. Runs for every
      # version, since every version ships the table pinned to its own ref.
      - name: Test pathogen sheet table
        run: |
          npm install --no-fund --no-audit --no-save jsdom
          node scripts/test_pathogen_table.js

      # MkDocs serves extra_javascript/extra_css at stable filenames, so a
      # browser will reuse the previous deploy's copy and readers see stale
      # behaviour. Stamp them with the commit so each deploy is a fresh URL.
      - name: Stamp assets for cache busting
        run: |
          set -euo pipefail
          V="$(git rev-parse HEAD | cut -c1-12)"
          {
            echo "DOCS_JS_REF=javascripts/docs_ref.js?v=$V"
            echo "DOCS_JS_TABLE=javascripts/pathogen_table.js?v=$V"
            echo "DOCS_CSS_EXTRA=stylesheets/extra.css?v=$V"
            echo "DOCS_CSS_TABLE=stylesheets/pathogen_table.css?v=$V"
          } >> "$GITHUB_ENV"
          echo "Assets stamped with ?v=$V"

          # Footer build stamp. mkdocs.yml reads DOCS_COPYRIGHT via !ENV and
          # Material renders it as raw HTML, so no theme template is involved.
          # The copyright text itself is read back out of mkdocs.yml rather
          # than repeated here, so it stays defined in exactly one place.
          BASE="$(sed -nE 's/^copyright: !ENV \[DOCS_COPYRIGHT, "(.*)"\].*/\1/p' mkdocs.yml)"
          test -n "$BASE" || { echo "::error::could not read the copyright default from mkdocs.yml"; exit 1; }
          SHA="$(git rev-parse HEAD)"
          REF='${{ matrix.target.ref }}'
          LABEL='${{ matrix.target.title || matrix.target.version }}'
          URL="https://github.com/${GITHUB_REPOSITORY}"
          echo "DOCS_COPYRIGHT=$BASE &middot; $LABEL &middot; built from <a href=\"$URL/tree/$REF\"><code>$REF</code></a> &middot; <a href=\"$URL/commit/$SHA\"><code>${SHA:0:7}</code></a>" >> "$GITHUB_ENV"

      - name: Build site
        run: mkdocs build --strict

      # mkdocs --strict only validates Markdown links; this catches raw-HTML
      # src paths, which resolve against the page's directory URL.
      - name: Check built links
        run: python scripts/test_built_links.py --site site

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # mike keeps versions and aliases in one namespace, so `latest` cannot
      # become an alias of `stable` while a *version* named `latest` still
      # exists on gh-pages — the deploy would fail with "alias 'latest' already
      # specified as a version". The previous scheme left exactly that behind:
      # a `latest` version titled "stable (vX.Y.Z)" that carries `stable` as an
      # alias, i.e. the two names swapped. Deleting the version drops its
      # aliases with it, so this one call clears both halves of the swap.
      #
      # The check reads mike's own versions.json rather than grepping the
      # `mike list` text: a titled version prints as `"stable (v3.3.10)"
      # (latest)`, which a line-anchored grep for `latest` silently misses —
      # which is how the deploy started failing. Aliases named `latest` are
      # deliberately not matched; once the migration has happened the list
      # reads `stable [latest]` and this step does nothing.
      - name: Retire the legacy `latest` version
        if: matrix.target.version == 'stable'
        run: |
          set -euo pipefail
          VERSIONS="$(mike list --branch "$PAGES_BRANCH" --json 2>/dev/null \
            || git show "origin/$PAGES_BRANCH:versions.json" 2>/dev/null \
            || echo '[]')"
          if jq -e 'any(.[]; .version == "latest")' >/dev/null <<<"$VERSIONS"; then
            echo "Deleting the old standalone 'latest' version; it becomes an alias of 'stable'."
            mike delete --push --branch "$PAGES_BRANCH" latest
          else
            echo "No standalone 'latest' version; nothing to retire."
          fi

      - name: Deploy version
        run: |
          set -euo pipefail
          ARGS=(deploy --push --branch "$PAGES_BRANCH" --update-aliases)
          TITLE='${{ matrix.target.title }}'
          if [ -n "$TITLE" ]; then ARGS+=(--title "$TITLE"); fi
          # shellcheck disable=SC2206
          mike "${ARGS[@]}" '${{ matrix.target.version }}' ${{ matrix.target.aliases }}

      # The site root redirects here. Without this the root 404s. Idempotent, so
      # it is safe to reassert whenever stable moves.
      - name: Point default at stable
        if: matrix.target.version == 'stable'
        run: mike set-default --push --branch "$PAGES_BRANCH" stable

      # Prune entries left over from earlier versioning schemes:
      #   bleeding-edge  predates the switch to `latest`
      #   X.Y            minor-series entries from before exact patch versions
      # Matching on the X.Y shape (rather than a hard-coded list) means this
      # keeps working if another stale minor entry turns up. X.Y.Z is never
      # matched, so real release docs are safe.
      - name: Prune retired docs versions
        run: |
          set -euo pipefail
          RETIRED="$(mike list --branch "$PAGES_BRANCH" 2>/dev/null \
            | sed -E 's/ \[.*//' \
            | grep -xE 'bleeding-edge|[0-9]+\.[0-9]+' || true)"
          if [ -z "$RETIRED" ]; then
            echo "No retired versions present; nothing to prune."
            exit 0
          fi
          echo "Pruning: $(echo "$RETIRED" | tr '\n' ' ')"
          # shellcheck disable=SC2086
          mike delete --push --branch "$PAGES_BRANCH" $RETIRED

      - name: Summary
        run: |
          {
            echo "### Docs deployed"
            echo ""
            echo "- **Version:** \`${{ matrix.target.version }}\`"
            echo "- **Shown as:** ${{ matrix.target.title || matrix.target.version }}"
            echo "- **Built from:** \`${{ matrix.target.ref }}\` ($(git rev-parse --short HEAD))"
            echo "- **URL:** https://jhuapl-bio.github.io/taxtriage/${{ matrix.target.version }}/"
          } >> "$GITHUB_STEP_SUMMARY"
