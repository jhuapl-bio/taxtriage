<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1864ab;}
    .sub{font-size:12px;fill:#495057;}
    .hd{font-size:12px;font-weight:700;fill:#37474f;}
    .g{font-size:13px;font-style:italic;font-weight:600;fill:#212529;}
    .v{font-size:12px;fill:#212529;}
    .sm{font-size:10px;fill:#868e96;}
    .tag{font-size:10px;font-weight:700;}
  </style>

  <text x="20" y="28" class="ttl">Genus: TASS vs MMseqs</text>
  <text x="20" y="48" class="sub">Closed-set TASS (left) beside what the reference-free MMseqs search places (right). Genera MMseqs finds but the reference set never aligned are tagged Rescued.</text>

  <!-- header row -->
  <line x1="20" y1="64" x2="900" y2="64" stroke="#dee2e6"/>
  <text x="28"  y="82" class="hd">Genus</text>
  <text x="210" y="82" class="hd">Source</text>
  <text x="360" y="82" class="hd">Genus TASS · cov</text>
  <text x="560" y="82" class="hd">% reads (aligned)</text>
  <text x="720" y="82" class="hd">mmseqs hits · % placed</text>
  <line x1="20" y1="92" x2="900" y2="92" stroke="#dee2e6"/>

  <!-- row 1: Monkeypox - Both -->
  <text x="28" y="118" class="g">Monkeypox</text>
  <rect x="210" y="106" width="58" height="16" rx="8" fill="#e7f5ff"/><text x="239" y="118" text-anchor="middle" class="tag" fill="#1864ab">Both</text>
  <text x="360" y="118" class="v" font-weight="700" fill="#2f9e44">86.0</text>
  <rect x="392" y="110" width="84" height="7" rx="3" fill="#f1f3f5"/><rect x="392" y="110" width="72" height="7" rx="3" fill="#2f9e44"/>
  <text x="484" y="118" class="sm">cov 74%</text>
  <text x="560" y="118" class="v">3.142%</text>
  <text x="720" y="118" class="v" font-weight="700" fill="#e8590c">9</text>
  <rect x="742" y="110" width="84" height="7" rx="3" fill="#f1f3f5"/><rect x="742" y="110" width="50" height="7" rx="3" fill="#f59f00"/>
  <text x="834" y="118" class="sm">30%</text>
  <line x1="20" y1="130" x2="900" y2="130" stroke="#f1f3f5"/>

  <!-- row 2: Salmonella - Aligned only -->
  <text x="28" y="156" class="g">Salmonella</text>
  <rect x="210" y="144" width="88" height="16" rx="8" fill="#fff4e6"/><text x="254" y="156" text-anchor="middle" class="tag" fill="#d9480f">Aligned only</text>
  <text x="360" y="156" class="v" font-weight="700" fill="#f59f00">42.0</text>
  <rect x="392" y="148" width="84" height="7" rx="3" fill="#f1f3f5"/><rect x="392" y="148" width="35" height="7" rx="3" fill="#f59f00"/>
  <text x="484" y="156" class="sm">cov 12%</text>
  <text x="560" y="156" class="v">0.500%</text>
  <text x="720" y="156" class="v" fill="#adb5bd">—</text>
  <line x1="20" y1="168" x2="900" y2="168" stroke="#f1f3f5"/>

  <!-- row 3: Yersinia - Rescued -->
  <text x="28" y="194" class="g">Yersinia</text>
  <rect x="210" y="182" width="120" height="16" rx="8" fill="#ebfbee"/><text x="270" y="194" text-anchor="middle" class="tag" fill="#2b8a3e">Rescued (mmseqs)</text>
  <text x="360" y="194" class="v" fill="#adb5bd">—</text>
  <text x="560" y="194" class="v" fill="#adb5bd">—</text>
  <text x="720" y="194" class="v" font-weight="700" fill="#e8590c">3</text>
  <rect x="742" y="186" width="84" height="7" rx="3" fill="#f1f3f5"/><rect x="742" y="186" width="20" height="7" rx="3" fill="#f59f00"/>
  <text x="834" y="194" class="sm">18%</text>
  <line x1="20" y1="206" x2="900" y2="206" stroke="#f1f3f5"/>

  <!-- row 4: Staphylococcus - Both -->
  <text x="28" y="232" class="g">Staphylococcus</text>
  <rect x="210" y="220" width="58" height="16" rx="8" fill="#e7f5ff"/><text x="239" y="232" text-anchor="middle" class="tag" fill="#1864ab">Both</text>
  <text x="360" y="232" class="v" font-weight="700" fill="#2f9e44">99.8</text>
  <rect x="392" y="224" width="84" height="7" rx="3" fill="#f1f3f5"/><rect x="392" y="224" width="83" height="7" rx="3" fill="#2f9e44"/>
  <text x="484" y="232" class="sm">cov 59%</text>
  <text x="560" y="232" class="v">7.893%</text>
  <text x="720" y="232" class="v" font-weight="700" fill="#e8590c">56</text>
  <rect x="742" y="224" width="84" height="7" rx="3" fill="#f1f3f5"/><rect x="742" y="224" width="60" height="7" rx="3" fill="#f59f00"/>
  <text x="834" y="232" class="sm">38%</text>
  <line x1="20" y1="244" x2="900" y2="244" stroke="#dee2e6"/>

  <g transform="translate(28,272)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#e7f5ff"/><text x="20" y="11" class="sub"><tspan font-weight="700" fill="#1864ab">Both</tspan> — aligned AND placed by mmseqs</text>
    <rect x="300" y="0" width="13" height="13" rx="3" fill="#fff4e6"/><text x="320" y="11" class="sub"><tspan font-weight="700" fill="#d9480f">Aligned only</tspan> — reference hit, mmseqs silent</text>
    <rect x="0" y="24" width="13" height="13" rx="3" fill="#ebfbee"/><text x="20" y="35" class="sub"><tspan font-weight="700" fill="#2b8a3e">Rescued</tspan> — mmseqs found it, no reference in the run (the limited-reference / mock case)</text>
  </g>

  <text x="20" y="346" class="sm">Illustrative values. Rows sort by combined signal; every score / bar carries a hover tooltip in the report.</text>
</svg>
