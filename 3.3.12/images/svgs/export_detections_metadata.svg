<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 7,3 0,6 Z" fill="#495057"/>
    </marker>
    <style>
      .t{font-size:12px;fill:#212529}
      .tb{font-size:12px;font-weight:700;fill:#212529}
      .cap{font-size:12px;font-weight:700;fill:#1864ab}
      .ts{font-size:11px;fill:#495057}
      .pill{fill:#e7f5ff;stroke:#1c7ed6;stroke-width:1.3}
      .pillhi{fill:#fff4e6;stroke:#f76707;stroke-width:1.5}
      .grid{fill:#fff;stroke:#ced4da;stroke-width:1}
      .hdr{fill:#e9ecef;stroke:#ced4da;stroke-width:1}
      .mhdr{fill:#ffe8cc;stroke:#ced4da;stroke-width:1}
      .mcell{fill:#fff4e6;stroke:#ced4da;stroke-width:1}
      .edge{stroke:#495057;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1864ab">Exporting hits with their metadata</text>

  <!-- steps -->
  <rect class="pill" x="20"  y="42" width="150" height="26" rx="13"/><text class="t" x="95"  y="59" text-anchor="middle">Right panel · Filters</text>
  <path class="edge" d="M172,55 H184" marker-end="url(#arr)"/>
  <rect class="pill" x="188" y="42" width="80"  height="26" rx="13"/><text class="tb" x="228" y="59" text-anchor="middle">Export…</text>
  <path class="edge" d="M270,55 H282" marker-end="url(#arr)"/>
  <rect class="pill" x="286" y="42" width="100" height="26" rx="13"/><text class="t" x="336" y="59" text-anchor="middle">Data tables</text>
  <path class="edge" d="M388,55 H400" marker-end="url(#arr)"/>
  <rect class="pillhi" x="404" y="42" width="190" height="26" rx="13"/><text class="tb" x="499" y="59" text-anchor="middle">☑ Detections + Metadata</text>
  <path class="edge" d="M596,55 H608" marker-end="url(#arr)"/>
  <rect class="pill" x="612" y="42" width="168" height="26" rx="13"/><text class="t" x="696" y="59" text-anchor="middle">XLSX / CSV / TSV</text>

  <!-- Detections table -->
  <text class="cap" x="20" y="102">Detections</text>
  <rect class="hdr"  x="20"  y="108" width="80"  height="20"/><text class="tb" x="28"  y="122">Specimen</text>
  <rect class="hdr"  x="100" y="108" width="120" height="20"/><text class="tb" x="108" y="122">Organism</text>
  <rect class="hdr"  x="220" y="108" width="60"  height="20"/><text class="tb" x="228" y="122">TASS</text>
  <rect class="grid" x="20"  y="128" width="80"  height="20"/><text class="t" x="28"  y="142">S1</text>
  <rect class="grid" x="100" y="128" width="120" height="20"/><text class="t" x="108" y="142">Influenza A</text>
  <rect class="grid" x="220" y="128" width="60"  height="20"/><text class="t" x="228" y="142">0.94</text>
  <rect class="grid" x="20"  y="148" width="80"  height="20"/><text class="t" x="28"  y="162">S1</text>
  <rect class="grid" x="100" y="148" width="120" height="20"/><text class="t" x="108" y="162">E. coli</text>
  <rect class="grid" x="220" y="148" width="60"  height="20"/><text class="t" x="228" y="162">0.71</text>
  <rect class="grid" x="20"  y="168" width="80"  height="20"/><text class="t" x="28"  y="182">S2</text>
  <rect class="grid" x="100" y="168" width="120" height="20"/><text class="t" x="108" y="182">Influenza A</text>
  <rect class="grid" x="220" y="168" width="60"  height="20"/><text class="t" x="228" y="182">0.88</text>

  <!-- Metadata table -->
  <text class="cap" x="20" y="222">Run metadata</text>
  <rect class="hdr"  x="20"  y="228" width="80"  height="20"/><text class="tb" x="28"  y="242">Specimen</text>
  <rect class="mhdr" x="100" y="228" width="100" height="20"/><text class="tb" x="108" y="242">Location</text>
  <rect class="mhdr" x="200" y="228" width="80"  height="20"/><text class="tb" x="208" y="242">Host</text>
  <rect class="grid" x="20"  y="248" width="80"  height="20"/><text class="t" x="28"  y="262">S1</text>
  <rect class="mcell" x="100" y="248" width="100" height="20"/><text class="t" x="108" y="262">Baltimore</text>
  <rect class="mcell" x="200" y="248" width="80"  height="20"/><text class="t" x="208" y="262">Human</text>
  <rect class="grid" x="20"  y="268" width="80"  height="20"/><text class="t" x="28"  y="282">S2</text>
  <rect class="mcell" x="100" y="268" width="100" height="20"/><text class="t" x="108" y="282">Denver</text>
  <rect class="mcell" x="200" y="268" width="80"  height="20"/><text class="t" x="208" y="282">Swine</text>

  <!-- join arrows -->
  <path class="edge" d="M284,148 C320,148 320,190 354,190" marker-end="url(#arr)"/>
  <path class="edge" d="M284,258 C320,258 320,210 354,210" marker-end="url(#arr)"/>

  <!-- Output table -->
  <text class="cap" x="360" y="152">Detections + Metadata  (one row per hit)</text>
  <rect class="hdr"  x="360" y="158" width="72"  height="20"/><text class="tb" x="368" y="172">Specimen</text>
  <rect class="hdr"  x="432" y="158" width="116" height="20"/><text class="tb" x="440" y="172">Organism</text>
  <rect class="hdr"  x="548" y="158" width="52"  height="20"/><text class="tb" x="556" y="172">TASS</text>
  <rect class="mhdr" x="600" y="158" width="100" height="20"/><text class="tb" x="608" y="172">Location</text>
  <rect class="mhdr" x="700" y="158" width="80"  height="20"/><text class="tb" x="708" y="172">Host</text>

  <rect class="grid"  x="360" y="178" width="72"  height="20"/><text class="t" x="368" y="192">S1</text>
  <rect class="grid"  x="432" y="178" width="116" height="20"/><text class="t" x="440" y="192">Influenza A</text>
  <rect class="grid"  x="548" y="178" width="52"  height="20"/><text class="t" x="556" y="192">0.94</text>
  <rect class="mcell" x="600" y="178" width="100" height="20"/><text class="t" x="608" y="192">Baltimore</text>
  <rect class="mcell" x="700" y="178" width="80"  height="20"/><text class="t" x="708" y="192">Human</text>

  <rect class="grid"  x="360" y="198" width="72"  height="20"/><text class="t" x="368" y="212">S1</text>
  <rect class="grid"  x="432" y="198" width="116" height="20"/><text class="t" x="440" y="212">E. coli</text>
  <rect class="grid"  x="548" y="198" width="52"  height="20"/><text class="t" x="556" y="212">0.71</text>
  <rect class="mcell" x="600" y="198" width="100" height="20"/><text class="t" x="608" y="212">Baltimore</text>
  <rect class="mcell" x="700" y="198" width="80"  height="20"/><text class="t" x="708" y="212">Human</text>

  <rect class="grid"  x="360" y="218" width="72"  height="20"/><text class="t" x="368" y="232">S2</text>
  <rect class="grid"  x="432" y="218" width="116" height="20"/><text class="t" x="440" y="232">Influenza A</text>
  <rect class="grid"  x="548" y="218" width="52"  height="20"/><text class="t" x="556" y="232">0.88</text>
  <rect class="mcell" x="600" y="218" width="100" height="20"/><text class="t" x="608" y="232">Denver</text>
  <rect class="mcell" x="700" y="218" width="80"  height="20"/><text class="t" x="708" y="232">Swine</text>

  <text class="ts" x="360" y="258">Metadata is joined on by Specimen ID, so each sample's</text>
  <text class="ts" x="360" y="273">values repeat on every one of its hits. All detection columns</text>
  <text class="ts" x="360" y="288">(TASS Cutoff, Passes Cutoff, QC flag…) are kept.</text>
  <text class="ts" x="20" y="316">Rows follow the sidebar filters and TASS cutoff while “Apply current filters” is on.</text>
</svg>
