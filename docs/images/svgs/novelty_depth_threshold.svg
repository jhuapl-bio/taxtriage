  <text
     x="20"
     y="28"
     class="ttl"
     id="text611">Depth-scaled candidate threshold</text>
  <text
     x="20"
     y="48"
     class="sub"
     id="text613">A genus+ taxon is reported only if its hit count clears the cutoff. The old fixed cutoff of 10 erased every Nanopore candidate; the cutoff now scales with the placeable-hit pool.</text>
  <text
     x="20"
     y="66"
     class="sub"
     font-style="italic"
     id="text615">effective cutoff = max( min_reads floor = 2,  ceil( min_cand_frac 0.002 × placeable hits ) )</text>
  <!-- LEFT: Nanopore -->
  <text
     x="40"
     y="100"
     class="h"
     id="text617">Nanopore_Run_A — 42 placeable hits → cutoff = 2</text>
  <!-- baseline y=260, bars upward; x from 60 -->
  <g
     id="g651">
    <!-- counts: Enterobacteriaceae5, Enterobacterales5, Staphylococcus5, Gammaproteobacteria5, Bacteria(domain)5, Yersinia3, Streptococcus2, Pseudomonadota2, others1 -->
