  <text
     x="56"
     y="344"
     class="note"
     fill="#2b8a3e"
     font-weight="700"
     id="text685">Why scale by placeable hits, not total reads?</text>
  <text
     x="56"
     y="364"
     class="note"
     fill="#495057"
     id="text687">Candidate counts are in ORF / contig units (what MMseqs placed), not raw reads. Scaling against the placeable pool keeps a 117k-read</text>
  <text
     x="56"
     y="380"
     class="note"
     fill="#495057"
     id="text689">Illumina run as strict as before while letting a 3k-read long-read mock still surface its top genera instead of an empty table.</text>
